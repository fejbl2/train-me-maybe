name: Build and Push Docker Image

on:
  push:
    branches:
      - pa200

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to Azure CLI
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get Git SHA
      id: git-sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build and push Docker backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/train-me-maybe:pa200-gemrot-${{ env.sha }}

    - name: Deploy backend to Azure Container App
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az containerapp revision copy \
            --name pa200-hw02-containerapp \
            --resource-group PA200-HW02 \
            --from-revision latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/train-me-maybe:pa200-gemrot-${{ env.sha }}

    - name: Build the frontend and upload it to Azure Blob Storage
      run: |
        cd frontend
        npm ci
        npm run build
        
        az storage blob delete-batch \
          --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
          --account-key ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }} \
          --source pa200-hw02 \
          --auth-mode login
        
        az storage blob upload-batch \
          --destination pa200-hw02 \
          --source dist \
          --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
          --account-key ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }} \
          --auth-mode login